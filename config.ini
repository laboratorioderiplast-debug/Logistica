; ============================================================
; Configurazione connessione Arca e parametri applicazione
; ============================================================
; Non contiene password: si usa l'autenticazione integrata di
; Windows (Trusted_Connection), come nel client Arca mostrato
; nello screenshot di login (Server / Ditta).
; ============================================================

[arca]
; Driver ODBC installato su Windows. Confermato per questo PC: "SQL Server"
; (il driver ODBC classico incluso di default in Windows). Se in futuro
; installate "ODBC Driver 17/18 for SQL Server", potete usare quello.
driver = SQL Server

; Dal login di Arca: Server = svrgestionale.
; Nome REALE del database (verificato con SELECT name FROM sys.databases):
; "DERIPLAST" era solo il nome mostrato nel client, non il nome tecnico.
server = svrgestionale
database = ADB_DERIPLAST

; Autenticazione integrata di Windows (stesso utente che ha fatto login su Windows)
trusted_connection = yes

; timeout connessione in secondi
timeout = 5

[arca_tabelle]
; Nomi di tabella/vista confermati come ancora validi.
; Se in futuro cambiano, si modificano SOLO qui: il codice
; dell'app non va toccato.
;
; Usiamo le viste VV_Arca_Articoli / VV_Arca_Ordini (invece delle
; tabelle x_MST_PP_*): sono piu' complete, includono anche i limiti
; dimensionali (Min/Max diametro e spessore) usati per pre-compilare
; la sezione "Controlli dimensionali" del certificato.
;
; NOTA: "campo_famiglia" e "campo_applicazione" restano VUOTI perche'
; non tracciati in queste viste: vanno compilati a mano nel certificato.

; --- Anagrafica articoli (vista: VV_Arca_Articoli) ---
tabella_articoli = VV_Arca_Articoli
campo_codice_articolo = CODICE_AR
campo_descrizione = Descrizione
campo_norma = DescSDR
campo_famiglia =
campo_applicazione =
campo_pn = [SN or PN]
campo_sdr = DescSDR
campo_de = [Diameter Max]
; limiti dimensionali per la sezione "Controlli dimensionali" del certificato
campo_diam_min = [Diameter Min]
campo_diam_max = [Diameter Max]
campo_spess_min = [Thickness Min]
campo_spess_max = [Thickness Max]
campo_ovalizzazione = Roundness

; --- Ordini di produzione, OP (vista: VV_Arca_Ordini) ---
vista_op = VV_Arca_Ordini
campo_op_lotto = OP
campo_op_data = Data
campo_op_codice_articolo = Cod_Art
campo_op_linea = Linea
campo_op_turno =
campo_op_descrizione = Articolo_descrizione
campo_op_quantita = Qta
campo_op_id_riga = OP
; limiti dimensionali specifici per questo OP (spesso piu' precisi
; di quelli generici dell'articolo, se presenti)
campo_op_diam_min = Dmin
campo_op_diam_max = Dmax
campo_op_spess_min = SPmin
campo_op_spess_max = SPmax
campo_op_dn = DN

[app]
; Nome azienda mostrato in testata
ragione_sociale = Deriplast Group

; Firmatari di default per i nuovi certificati
preparato_da = Marcu Loris
approvato_da = Massimo Buzzoni

; Percorso database locale (materie prime, bozze certificati, storico)
; Percorso relativo alla cartella dell'app. Se vuoto, viene creato
; automaticamente in %APPDATA%\CertificatiEN31\dati.db su Windows.
db_locale =

; Modalita' demo: se true, le ricerche Articolo/OP usano dati finti
; invece di collegarsi davvero ad Arca. Utile per provare l'app
; senza essere sul PC collegato al server. Mettere "no" in produzione.
modalita_demo = no
